workspace:
  base_dir: ./projects
  cleanup_on_failure: false
  cleanup_temp_files: true
  cleanup_ttl_hours: 72
  keep_logs: true
  max_workspaces: 100
opencode:
  binary: opencode
  model: opencode/muse-spark-1.3-contributor-free
  fallback_model: opencode/mimo-v2.6-flash-free
  default_timeout: 900
  plan_timeout_seconds: 1200
  skills_dir: .opencode/skills
  max_repair_iterations: 3
  test_mode: true
  implementation_mode: modular
  repair_policy: persistent
  docker_isolation: per_task
  docker_image: ghcr.io/anomalyco/opencode:latest
  docker_binary: opencode
  docker_network: bridge
  docker_memory: ''
  docker_cpus: ''
  docker_auth_dir: ''
  docker_container: opencode-agent
  docker_workspace: /workspace
  docker_host_workspace: ./projects
limits:
  max_prompt_bytes: 200000
  max_parallel_workers: 2
knowledge:
  enabled: true
ghdl:
  binary: ghdl
  timeout_seconds: 60
vivado:
  binary: /home/alex/Xilinx/2026.1/Vivado/bin/vivado
  settings_script: /home/alex/Xilinx/2026.1/Vivado/settings64.sh
  timeout_seconds: 600
flash:
  method: openfpgaloader
  timeout_seconds: 120
dashboard:
  host: 0.0.0.0
  port: 8088
  websocket_path: /ws
logging:
  level: INFO
  format: structured
  output: console
  log_dir: ./logs
domains:
  default: vhdl
  search_paths:
  - ./Schaltungsagent/src/domain_plugins
  paths:
    vhdl: ./Schaltungsagent/src/domain_plugins/vhdl
eda_tools:
  modelsim_binary: ~/.wine/drive_c/intelFPGA/18.1/modelsim_ase/win32aloem/vsim.exe
  modelsim_wine: wine
synthesis:
  enabled: true
  default_fpga: arty_s7_50
  timeout_seconds: 120
hardware_test:
  uart_port: /dev/ttyUSB1
  baudrate: 115200
  timeout_seconds: 5.0
  uart_integration: auto
gates:
  min_module_coverage: 1.0
  enforce_contracts: true
  require_timing_closure: true
  requirements_review: true
