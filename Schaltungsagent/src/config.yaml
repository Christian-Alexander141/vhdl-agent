llm:
  provider: ollama
  model: gpt-oss:120b-cloud
  base_url: http://localhost:11434
  temperature: 0.1
  max_tokens: 4096
  context_window: 32768
  api_key_file: ""
  chat_timeout_seconds: 120
  naming_timeout_seconds: 30
  naming_max_tokens: 96
  fallback_model: llama3.2:1b
  fallback_cooldown: 60
  primary_timeout: 120
  fallback_timeout: 600

workspace:
  base_dir: ./projects
  cleanup_on_failure: false
  cleanup_temp_files: true
  cleanup_ttl_hours: 72
  keep_logs: true
  max_workspaces: 100

opencode:
  binary: opencode
  model: opencode/mimo-v2.6-flash-free
  fallback_model: opencode/mimo-v2.6-flash-free
  default_timeout: 600
  plan_timeout_seconds: 600
  skills_dir: .opencode/skills
  max_repair_iterations: 5
  # Nativ, bis das MAS einem einzelnen OpenCode (gleiches Modell) überlegen ist;
  # danach wieder Docker-Isolation (test_mode: false) für den Produktivbetrieb.
  test_mode: true
  implementation_mode: modular   # modular | single_session
  docker_isolation: per_task
  docker_image: ghcr.io/anomalyco/opencode:latest
  docker_binary: opencode
  docker_network: bridge
  docker_memory: ''
  docker_cpus: ''
  docker_auth_dir: ''
limits:
  max_prompt_bytes: 200000
  max_parallel_workers: 2
knowledge:
  enabled: true

vivado:
  binary: /home/alex/Xilinx/2026.1/Vivado/bin/vivado
  settings_script: /home/alex/Xilinx/2026.1/Vivado/settings64.sh
  timeout_seconds: 600

flash:
  method: openfpgaloader
  timeout_seconds: 120

dashboard:
  host: 0.0.0.0
  port: 8088
  websocket_path: /ws

logging:
  level: INFO
  format: structured
  output: console
  log_dir: ./logs

domains:
  default: vhdl
  search_paths:
    - ./src/domain_plugins
  paths:
    vhdl: ./src/domain_plugins/vhdl

eda_tools:
  modelsim_binary: ~/.wine/drive_c/intelFPGA/18.1/modelsim_ase/win32aloem/vsim.exe
  modelsim_wine: wine

synthesis:
  enabled: true
  default_fpga: arty_s7_50
  timeout_seconds: 120

# Echte Hardwaretests über UART. Ohne uart_port wird kein Hardwaretest
# ausgeführt und auch kein Erfolg gemeldet.
hardware_test:
  uart_port: ""
  baudrate: 115200
  timeout_seconds: 5.0
  uart_integration: auto   # auto | always | off

# Harte Gates zwischen den Phasen.
gates:
  min_module_coverage: 1.0
  enforce_contracts: true
  require_timing_closure: true
