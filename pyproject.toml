[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vhdl-agent"
version = "0.1.0"
description = "KI-gestützte Agentenplattform für VHDL-Workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["vhdl", "agent", "llm", "rag", "fastapi", "docker"]
authors = [
  { name = "Schaltungsagent", email = "noreply@example.com" }
]
dependencies = [
  "pydantic>=2.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "ollama>=0.4.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "aiofiles>=23.0.0",
  "langchain-core>=0.3.0",
  "langchain-ollama>=1.0.0",
  "langchain-huggingface>=1.0.0",
  "huggingface-hub>=0.23.0",
  "langgraph>=0.4.0",
  "langchain-qdrant>=1.0.0",
  "qdrant-client>=1.9.0",
  "langchain-text-splitters>=1.0.0",
  "sentence-transformers>=2.2.0",
  "pypdf>=5.0.0",
  "jinja2>=3.1.0"
]

[project.scripts]
schaltungsagent = "src.main:main"

[tool.setuptools]
package-dir = { "" = "Schaltungsagent" }
include-package-data = true

[tool.setuptools.package-data]
src = ["config.yaml"]

[tool.setuptools.packages.find]
where = ["Schaltungsagent"]
include = ["src*"]
