version: '3.9'

services:
  hermes:
    image: hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    volumes:
      - ./hermes:/workspace
      - ./shared:/shared
      - ./config:/config
      - ./:/agent_repo:ro
    working_dir: /workspace

  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode-agent
    restart: unless-stopped
    volumes:
      - ./opencode:/workspace
      - ./shared:/shared
      - ./config:/config
      - ./:/agent_repo:ro
    working_dir: /workspace
